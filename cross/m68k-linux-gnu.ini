# Debian's m68k cross toolchain (gcc-m68k-linux-gnu):
#   meson setup --cross-file cross/m68k-linux-gnu.ini build-m68k
# qemu-m68k runs the m68k binaries for configure checks and meson test.
[binaries]
c = 'm68k-linux-gnu-gcc'
ar = 'm68k-linux-gnu-ar'
strip = 'm68k-linux-gnu-strip'
exe_wrapper = ['qemu-m68k']

[built-in options]
# static, so that qemu-m68k needs no m68k sysroot
c_link_args = ['-static']

[host_machine]
system = 'linux'
cpu_family = 'm68k'
cpu = 'm68040'
endian = 'big'
