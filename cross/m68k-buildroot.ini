# A buildroot SDK (m68k-buildroot-linux-gnu_sdk-buildroot).  Give its
# location in a machine file of your own, read first:
#   printf "[constants]\nsdk = '%s'\n" /path/to/sdk > sdk.ini
#   meson setup --cross-file sdk.ini --cross-file cross/m68k-buildroot.ini build-m68k
[binaries]
c = sdk / 'bin/m68k-buildroot-linux-gnu-gcc'
ar = sdk / 'bin/m68k-buildroot-linux-gnu-ar'
strip = sdk / 'bin/m68k-buildroot-linux-gnu-strip'
exe_wrapper = ['qemu-m68k']

[built-in options]
c_link_args = ['-static']

[host_machine]
system = 'linux'
cpu_family = 'm68k'
cpu = 'm68040'
endian = 'big'
